services:
  - type: web
    name: online-shop-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB
        sync: false
      - key: JWT_KEY
        sync: false
      - key: JWT_Expire
        sync: false
      - key: JWT_RESET_EXPIRE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
